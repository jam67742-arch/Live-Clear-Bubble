name: Build Live Clear Bubble APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LiveClearBubble_AndroidStudio_Project.zip'
      - '.github/workflows/blank.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract project
        run: unzip -o LiveClearBubble_AndroidStudio_Project.zip -d project
      - name: Fix Gradle properties
        working-directory: project/LiveClearBubble
        run: |
          printf '%s\n' 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' 'android.useAndroidX=true' 'kotlin.code.style=official' > gradle.properties
          echo '--- gradle.properties ---'
          cat gradle.properties
      - name: Add missing AndroidX Activity dependency
        working-directory: project/LiveClearBubble
        run: |
          cat >> app/build.gradle <<'EOF'

          dependencies {
              implementation 'androidx.activity:activity-ktx:1.10.1'
          }
          EOF
      - name: Align Java and Kotlin JVM targets
        working-directory: project/LiveClearBubble
        run: |
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g; s/jvmTarget = "1.8"/jvmTarget = "17"/g; s/jvmTarget = '\''1.8'\''/jvmTarget = '\''17'\''/g' app/build.gradle
          cat >> app/build.gradle <<'EOF'

          // Force matching bytecode targets for Android Java and Kotlin tasks.
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF
          echo '--- app/build.gradle JVM settings ---'
          tail -n 18 app/build.gradle
      - name: Build APK
        working-directory: project/LiveClearBubble
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Live-Clear-Bubble-APK
          path: project/LiveClearBubble/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
